applications:
  - name: obsidian
    fetcher:
      type: github
      repo: obsidianmd/obsidian-releases
      file_pattern: "*_amd64.deb "
    installer:
      type: deb
  - name: claude-desktop
    fetcher:
      type: github
      repo: aaddrick/claude-desktop-debian
      file_pattern: "*_amd64.deb"
    installer:
      type: deb

