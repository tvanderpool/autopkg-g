name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"
      
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl --verbose
      
      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp target/x86_64-unknown-linux-musl/release/autopkg release/autopkg
          cd release
          sha256sum autopkg > autopkg.sha256
          tar -czf autopkg-${{ steps.tag.outputs.TAG }}-x86_64-unknown-linux-musl.tar.gz autopkg autopkg.sha256
          sha256sum autopkg-${{ steps.tag.outputs.TAG }}-x86_64-unknown-linux-musl.tar.gz > autopkg-${{ steps.tag.outputs.TAG }}-x86_64-unknown-linux-musl.tar.gz.sha256
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/autopkg-${{ steps.tag.outputs.TAG }}-x86_64-unknown-linux-musl.tar.gz
            release/autopkg-${{ steps.tag.outputs.TAG }}-x86_64-unknown-linux-musl.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
